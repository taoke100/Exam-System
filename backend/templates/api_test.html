<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🔍 API 测试工具</h1>
  <button onclick="testGenerate()">测试生成试卷</button>
  <button onclick="testGet()">测试获取科目</button>
  <div id="result" style="margin-top:20px;padding:15px;background:#f5f5f5;border-radius:5px;"></div>
  
  <script>
    async function testGenerate() {
      document.getElementById('result').innerHTML = '测试中...';
      try {
        const res = await fetch('http://localhost:5000/api/papers/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ grade: '三年级', subject: '数学', semester: '上册' })
        });
        const data = await res.json();
        document.getElementById('result').innerHTML = 
          `<div class="success">
            ✅ 成功！<br>
            paper_id: ${data.paper_id}<br>
            题目数: ${data.questions.length}<br>
            第一题: ${data.questions[0]?.question || 'N/A'}
          </div>`;
      } catch (e) {
        document.getElementById('result').innerHTML = 
          `<div class="error">❌ 错误: ${e.message}</div>`;
      }
    }
    
    async function testGet() {
      document.getElementById('result').innerHTML = '测试中...';
      try {
        const res = await fetch('http://localhost:5000/api/subjects');
        const data = await res.json();
        document.getElementById('result').innerHTML = 
          `<div class="success">✅ 成功！<br>科目: ${JSON.stringify(data)}</div>`;
      } catch (e) {
        document.getElementById('result').innerHTML = 
          `<div class="error">❌ 错误: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
